<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Premium Dark Theme */
    body {
      background-color: #121212; /* Deep cinematic black */
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =======================================
       1. UPGRADED CINEMATIC LOADING OVERLAY
       ======================================= */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    /* Glowing Shadow Portal Orb */
    .portal-loader {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .portal-ring {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: #cbca46; /* Gold */
      border-bottom-color: #cbca46;
      animation: spinPortal 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-shadow: 0 0 15px rgba(203, 202, 70, 0.4), inset 0 0 15px rgba(203, 202, 70, 0.2);
    }

    .portal-core {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 50px;
      height: 50px;
      background-color: #121212;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.1);
      animation: pulseCore 2s ease-in-out infinite;
    }

    /* Typing Text Effect */
    .loading-text {
      color: #cbca46;
      margin-top: 30px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: monospace;
      border-right: 2px solid #cbca46;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      animation: typing 2s steps(30, end) forwards, blink 0.6s step-end infinite;
    }

    /* Animations */
    @keyframes spinPortal {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
    }
    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }
    @keyframes blink {
      from, to { border-color: transparent }
      50% { border-color: #cbca46; }
    }

    /* =======================================
       2. MODERN GLASSMORPHISM CARD PANEL 
       ======================================= */
    .glass-card {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(38, 37, 34, 0.75); /* Semi-transparent Chess.com Dark UI */
      backdrop-filter: blur(12px); /* Glass blur effect */
      -webkit-backdrop-filter: blur(12px);
      padding: 35px 30px;
      border-radius: 16px;
      display: inline-block;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      transform: translateY(0);
      transition: transform 0.3s ease;
    }
    
    .glass-card:hover {
      transform: translateY(-5px);
    }

    .club-title {
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin-bottom: 5px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #a7a5a1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #cbca46;
      margin: 20px 0;
      background-color: #262522;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .join-btn {
      background: linear-gradient(135deg, #81b64c 0%, #6fa13e 100%); /* Premium Gradient Green */
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(129, 182, 76, 0.4);
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 20px;
      letter-spacing: 1px;
    }

    .join-btn:hover {
      background: linear-gradient(135deg, #93cb5a 0%, #81b64c 100%);
      box-shadow: 0 6px 20px rgba(129, 182, 76, 0.6);
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <!-- Premium Loader Overlay -->
  <div id="loading-screen">
    <div class="portal-loader">
      <div class="portal-ring"></div>
      <div class="portal-core"></div>
    </div>
    <div class="loading-text">Summoning the Shadows...</div>
  </div>

  <!-- Main Card Interface -->
  <div class="glass-card">
    <div class="club-title">DARKNESS OF NIGHT</div>
    <div style="color: #cbca46; font-size: 12px; letter-spacing: 4px; font-weight: bold;">OFFICIAL CLUB</div>
    
    <img id="player-pfp" class="user-avatar" src="https://chess.com" alt="Avatar">
    
    <p style="font-size: 16px; margin: 10px 0; color: #e2e2e2; line-height: 1.5;">
      Welcome to the realm, <br>
      <span id="player-username" style="color: #cbca46; font-weight: 700; font-size: 1.2rem;">Guest Player</span>
    </p>
    
    <button class="join-btn" onclick="redirectToJoin()">ENTER THE CLUB</button>
  </div>

  <script>
    // Fades out loading screen gracefully after assets complete
    window.addEventListener('load', function () {
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
      }, 3000); // 3 seconds total experience time
    });

    // Detect username from Chess.com context
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const detectedUser = urlParams.get('user') || urlParams.get('username');
      
      if(detectedUser && detectedUser !== "New Member") {
        document.getElementById('player-username').innerText = "@" + detectedUser;
        document.getElementById('player-pfp').src = "https://chess.com";
      }
    } catch(err) {
      console.log("Iframe constraint restriction managed.");
    }

    function redirectToJoin() {
      window.parent.location.href = "https://chess.com";
    }
  </script>
</body>
</html>
